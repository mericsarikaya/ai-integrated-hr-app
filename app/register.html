<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Hub | Kayıt Ol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
        <style>
        :root {
            --bg-color: #13151a;
            --card-bg: rgba(30, 34, 45, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08), transparent 25%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08), transparent 25%);
            color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem;
        }

        .login-wrapper { width: 100%; max-width: 360px; animation: fadeInUp 0.6s ease; }
        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .login-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.3rem; letter-spacing: -0.5px; }
        .login-header p { color: var(--text-muted); font-size: 0.9rem; }

        .login-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 1rem; }
        .form-group input { width: 100%; padding: 10px 12px 10px 36px; background: rgba(15, 17, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: all 0.2s ease; }
        .form-group input:focus { border-color: var(--accent); background: rgba(15, 17, 26, 0.8); }
        .form-group input::placeholder { color: #6b7280; }

        .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .login-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-btn .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .login-btn.loading .spinner { display: block; }
        .login-btn.loading .btn-text { display: none; }

        .error-msg, .message-box { padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 1.25rem; display: none; align-items: center; gap: 8px; }
        .error-msg.show, .message-box.show { display: flex; }
        .error-msg, .message-box.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .message-box.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #6ee7b7; }

        .users-hint { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,0.05); }
        .users-hint h4 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center; }
        .hint-cards { display: flex; flex-direction: column; gap: 8px; }
        .hint-card { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .hint-card:hover { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
        .hint-card .role-badge { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; min-width: 65px; text-align: center; }
        .hint-card .role-badge.candidate { background: rgba(234, 179, 8, 0.15); color: #fbbf24; }
        .hint-card .role-badge.employee  { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .hint-card .role-badge.hradmin   { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .hint-card .hint-info { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .hint-card .hint-user { font-size: 0.85rem; font-weight: 500; }
        .hint-card .hint-pass { font-size: 0.75rem; color: var(--text-muted); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-header">
            <h1>Kayıt Ol</h1>
            <p>Sisteme dahil olmak için hesap oluşturun</p>
        </div>

        <div class="login-card">
            <!-- Hata & Başarı Mesajları -->
            <div class="message-box error" id="errorMsg">
                <i class="ri-error-warning-line"></i>
                <span id="errorText"></span>
            </div>
            <div class="message-box success" id="successMsg">
                <i class="ri-check-line"></i>
                <span id="successText"></span>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="ri-user-line"></i>
                        <input type="text" id="username" placeholder="Kullanıcı adınızı belirleyin" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Şifre</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" placeholder="Şifrenizi belirleyin" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="registerBtn">
                    Kayıt Ol
                </button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Zaten hesabınız var mı? </span>
                <a href="/login.html" style="color: #3b82f6; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.3s ease;">Giriş Yap</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const successMsg = document.getElementById('successMsg');
            const successText = document.getElementById('successText');

            if (!username || !password) return;

            btn.disabled = true;
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            try {
                // Adım 1'de oluşturduğumuz yeni server.js endpoint'ine istek atıyoruz
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    successText.textContent = 'Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...';
                    successMsg.classList.add('show');
                    document.getElementById('registerForm').reset();
                    
                    // Başarılı olursa 2 saniye sonra login sayfasına gönder
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    const errMessage = await response.text();
                    errorText.textContent = errMessage || 'Kayıt olurken bir hata oluştu.';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                console.error("Kayıt Hatası:", err);
                errorText.textContent = 'Bağlantı Hatası: ' + err.message;
                errorMsg.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
