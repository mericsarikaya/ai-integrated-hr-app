<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>HR-AI Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
        <style>
        body { 
            font-family: 'Inter', sans-serif; background: #13151a; 
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08), transparent 25%);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
        }
        .chat-container { 
            width: 380px; height: 550px; background: rgba(30, 34, 45, 0.6); backdrop-filter: blur(10px);
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            background: rgba(20, 24, 34, 0.8); color: #f3f4f6; padding: 1rem; text-align: center; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header .title { flex: 1; text-align: center; font-size: 0.95rem; }
        .header .back-btn {
            background: rgba(255,255,255,0.05); border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 0.75rem; font-weight: 500; transition: all 0.2s;
        }
        .header .back-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.85rem; line-height: 1.4; }
        .bot { background: rgba(40, 48, 65, 0.8); align-self: flex-start; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 4px; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-area { display: flex; border-top: 1px solid rgba(255,255,255,0.05); padding: 1rem; background: rgba(20, 24, 34, 0.8); gap: 8px; }
        input { flex: 1; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(15, 17, 26, 0.5); color: #f3f4f6; border-radius: 8px; outline: none; font-size: 0.85rem; transition: all 0.2s; }
        input:focus { border-color: #3b82f6; background: rgba(15, 17, 26, 0.8); }
        input::placeholder { color: #6b7280; }
        button { background: #3b82f6; color: white; border: none; padding: 0 16px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='/index.html'">← Geri</button>
            <span class="title">İK Yapay Zeka Asistanı</span>
            <div style="width: 60px;"></div>
        </div>
        <div class="messages" id="messages">
            <div class="msg bot">Merhaba! İzin hakları, prosedürler veya bordro hakkında bana sorular sorabilirsiniz. Size nasıl yardımcı olabilirim?</div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Sorunuzu yazın (Örn: Yıllık iznim kaç gün?)...">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>

        async function sendMessage() {
            const input = document.getElementById('input');
            const messages = document.getElementById('messages');
            const text = input.value.trim();
            if(!text) return;

            // Kullanıcı mesajını ekle
            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            
            // Bot düşünüyor
            const botId = 'msg-' + Date.now();
            messages.innerHTML += `<div class="msg bot" id="${botId}">Düşünüyor...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/hr/askHRBot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ conversationId: "session1", question: text })
                });
                const data = await response.json();
                document.getElementById(botId).innerText = data.value || (data.error && data.error.message) || JSON.stringify(data);
            } catch (e) {
                document.getElementById(botId).innerText = "Sisteme ulaşılamadı.";
            }
            messages.scrollTop = messages.scrollHeight;
        }
        // Enter tuşuna basıldığında mesajı gönder
        document.getElementById('input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
