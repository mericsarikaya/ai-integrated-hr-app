<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Hub | Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #13151a;
            --card-bg: rgba(30, 34, 45, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08), transparent 25%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08), transparent 25%);
            color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem;
        }

        .login-wrapper { width: 100%; max-width: 360px; animation: fadeInUp 0.6s ease; }
        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .login-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.3rem; letter-spacing: -0.5px; }
        .login-header p { color: var(--text-muted); font-size: 0.9rem; }

        .login-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 1rem; }
        .form-group input { width: 100%; padding: 10px 12px 10px 36px; background: rgba(15, 17, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: all 0.2s ease; }
        .form-group input:focus { border-color: var(--accent); background: rgba(15, 17, 26, 0.8); }
        .form-group input::placeholder { color: #6b7280; }

        .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .login-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-btn .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .login-btn.loading .spinner { display: block; }
        .login-btn.loading .btn-text { display: none; }

        .error-msg, .message-box { padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 1.25rem; display: none; align-items: center; gap: 8px; }
        .error-msg.show, .message-box.show { display: flex; }
        .error-msg, .message-box.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .message-box.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #6ee7b7; }

        .users-hint { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,0.05); }
        .users-hint h4 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center; }
        .hint-cards { display: flex; flex-direction: column; gap: 8px; }
        .hint-card { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .hint-card:hover { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
        .hint-card .role-badge { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; min-width: 65px; text-align: center; }
        .hint-card .role-badge.candidate { background: rgba(234, 179, 8, 0.15); color: #fbbf24; }
        .hint-card .role-badge.employee  { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .hint-card .role-badge.hradmin   { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .hint-card .hint-info { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .hint-card .hint-user { font-size: 0.85rem; font-weight: 500; }
        .hint-card .hint-pass { font-size: 0.75rem; color: var(--text-muted); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-header">
            <h1>HR Hub</h1>
            <p>Devam etmek için giriş yapın</p>
        </div>

        <div class="login-card">
            <div class="error-msg" id="errorMsg">
                <i class="ri-error-warning-line"></i>
                <span id="errorText">Kullanıcı adı veya şifre hatalı.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="ri-user-line"></i>
                        <input type="text" id="username" placeholder="Kullanıcı adınızı girin" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Şifre</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" placeholder="Şifrenizi girin" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Giriş Yap</span>
                    <div class="spinner"></div>
                </button>
            </form>
            <div style="text-align: center; margin-top: 15px; margin-bottom: 10px;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Hesabınız yok mu? </span>
                <a href="/register.html" style="color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.3s ease;">Kayıt Ol</a>
            </div>

                <h4>Demo Kullanıcılar</h4>
                <div class="hint-cards">
                    <div class="hint-card" onclick="fillCredentials('aday', '1')">
                        <span class="role-badge candidate">Aday</span>
                        <div class="hint-info">
                            <span class="hint-user">aday</span>
                            <span class="hint-pass">şifre: 1</span>
                        </div>
                    </div>
                    <div class="hint-card" onclick="fillCredentials('calisan', '2')">
                        <span class="role-badge employee">Çalışan</span>
                        <div class="hint-info">
                            <span class="hint-user">calisan</span>
                            <span class="hint-pass">şifre: 2</span>
                        </div>
                    </div>
                    <div class="hint-card" onclick="fillCredentials('ik', '123456')">
                        <span class="role-badge hradmin">İK Çalışanı</span>
                        <div class="hint-info">
                            <span class="hint-user">ik</span>
                            <span class="hint-pass">şifre: 123456</span>
                        </div>
                    </div>
                </div>
            </div> -->
        </div>
    </div>

    <script>
// Eğer zaten giriş yapılmışsa ana sayfaya yönlendir
if (document.cookie.includes('hr_session=')) {
    window.location.href = '/index.html';
}

function fillCredentials(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}

async function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');

    if (!username || !password) return;

    btn.classList.add('loading');
    btn.disabled = true;
    errorMsg.classList.remove('show');

    try {
        const credentials = btoa(`${username}:${password}`);
        
        // $metadata yerine güvenilir bir veri endpoint'i kullanıyoruz
        const response = await fetch('/hr/JobPostings?$top=1', {
            method: 'GET',
            headers: {
                'Authorization': `Basic ${credentials}`,
                'Accept': 'application/json'
            }
        });

        if (response.ok) {
            const roleMap = {
                'aday':    { role: 'Candidate',  label: 'Aday' },
                'calisan': { role: 'Employee',   label: 'Çalışan' },
                'ik':      { role: 'HRAdmin',    label: 'İK Çalışanı' }
            };

            const userInfo = roleMap[username] || { role: 'Candidate', label: 'Kullanıcı' };

            sessionStorage.setItem('hr_user', JSON.stringify({
                username: username,
                role: userInfo.role,
                label: userInfo.label,
                credentials: credentials
            }));

            document.cookie = `hr_session=${credentials}; path=/; max-age=86400`;
            window.location.href = '/index.html';

        } else if (response.status === 401 || response.status === 403) {
            errorText.textContent = 'Kullanıcı adı veya şifre hatalı. (401 Unauthorized)';
            errorMsg.classList.add('show');
        } else {
            errorText.textContent = 'Sunucu beklenmeyen bir yanıt döndü: Hata Kodu ' + response.status;
            errorMsg.classList.add('show');
        }
    } catch (err) {
        console.error("Fetch Hatası:", err);
        // Gerçek hatayı ekrana yazdırıyoruz!
        errorText.textContent = 'Bağlantı Hatası: ' + err.message + ' (Terminalde cds watch çalışıyor mu?)';
        errorMsg.classList.add('show');
    } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}
    </script>

</body>
